<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TooKKIDS - Kids French & English Learning</title>
<meta name="description" content="TooKKIDS: bilingual French/English learning app for kids 3-8. Flashcards, quizzes, matching games, stories and songs.">
<meta name="theme-color" content="#6C5CE7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">

<body>
<div id="app"><p style="text-align:center;padding:40px;font-weight:800">Loading TooKKIDS...</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
// Register PWA service worker (only on http/https, not file:// in the Android WebView)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}
</script>
